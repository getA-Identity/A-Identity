[package]
name = "sandbox-tests"
description = "Integration tests: the three contracts deployed together on a local near-sandbox."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]

[dev-dependencies]
# Only for serde, serde_json and the json_types. near-sdk 5.30.1 refuses to compile on the
# host unless a host feature is on (a compile_error! guards it); "unit-testing" is the one
# `cargo near new` puts on dev-dependencies, and the contract crates already use it, so it
# adds nothing to Cargo.lock.
near-sdk = { workspace = true, features = ["unit-testing"] }
near-sandbox = { workspace = true }
near-api = { workspace = true }
cargo-near-build = { workspace = true }
tokio = { workspace = true }
testresult = { workspace = true }

[lints]
workspace = true
