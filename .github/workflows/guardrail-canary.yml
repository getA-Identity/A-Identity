# Guardrail canary (Phase 5.4).
#
# Answers one question on a schedule: is the guardrail still enforcing? It does that three
# ways, and NONE of them touches real money or creates anything:
#
#   1. Reruns the deterministic decision vectors locally. Pure functions, no account, no
#      network, no fabricated market data.
#   2. Probes the live public surfaces, including /api/guardrail-status, which runs canonical
#      vectors through the same pure engine the product uses and returns 503 if any of them
#      answers wrongly.
#   3. Calls one paid tool on every rail that sells today WITHOUT paying, and requires the
#      402 challenge. A 200 there is a paid tool answering for free.
#
# Explicitly NOT done here, because a monitor that writes is a monitor that can fake
# traction: no agent is created, no decision is recorded, no order or payment is placed on
# any real-money surface. Any synthetic activity that ever does get recorded is flagged `ci`
# and excluded from every traction headline (see policy/meter.ts aggregateTraction).
name: Guardrail canary

on:
  schedule:
    # Hourly. Slower than the keep-warm ping on purpose: this is a correctness check, not a
    # liveness one, and GitHub delays scheduled runs under load anyway.
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  vectors:
    name: Deterministic decision vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend deps
        run: npm install --prefix mcp

      - name: Policy engine vectors (pure, offline)
        run: npm test --prefix mcp

  live:
    name: Live public surfaces
    runs-on: ubuntu-latest
    steps:
      - name: Engine self-check on the live backend
        run: |
          set -euo pipefail
          URL="https://a-identity-backend.onrender.com/api/guardrail-status"
          # Retries cover a restart or a deploy in progress. A service that is briefly
          # unreachable is not the same as a guardrail that stopped enforcing.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -D /tmp/status.hdr -o /tmp/status.json -w "%{http_code}" --max-time 45 "$URL" || echo 000)
            echo "attempt $i: HTTP $code"
            # Render answers 503 for a SUSPENDED service, and our own endpoint answers 503
            # for "not enforcing". Same status code, completely different problem, and
            # conflating them means an infrastructure outage gets reported as a broken
            # guardrail. Render marks its own with a routing header, so check that first.
            # Learned the hard way on 2026-07-29, when both services were suspended for
            # exceeding the free monthly instance hours and this step would have blamed
            # the policy engine.
            if grep -qi '^x-render-routing:[[:space:]]*suspend' /tmp/status.hdr 2>/dev/null; then
              echo "::error::The backend service is SUSPENDED on Render. This is infrastructure,"
              echo "::error::not the guardrail. Check Render billing and instance-hour usage."
              exit 1
            fi
            if [ "$code" = "200" ]; then
              node -e "
                const s = require('/tmp/status.json');
                if (!s.enforcing) { console.error('NOT ENFORCING'); process.exit(1) }
                const failed = (s.vectors || []).filter(v => !v.pass);
                if (failed.length) { console.error('failed vectors:', JSON.stringify(failed)); process.exit(1) }
                console.log('enforcing, ' + s.vectors.length + ' vectors passed at ' + s.checkedAt);
              "
              exit 0
            fi
            # A 503 that is NOT a Render suspension came from our own endpoint, which
            # answers 503 exactly when the engine is not enforcing. A real failure, and it
            # must not be retried away.
            if [ "$code" = "503" ]; then
              echo "::error::The guardrail reported NOT enforcing."
              cat /tmp/status.json || true
              exit 1
            fi
            sleep 20
          done
          echo "could not reach the self-check after 6 attempts"
          exit 1

      - name: The ASP is up, and its paid tools charge unless it declares free mode
        # Runs even when the step above failed, and so does the traction step below: each
        # probes a different surface. While this step was red, from 2026-09-16 on, the
        # traction check was skipped on every run.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # This step used to demand a 402, because asp/payment.ts falls back to
          # `mode: 'free'` and SERVES the paid tools whenever PAY_TO_ADDRESS, the three OKX
          # keys or OKX's facilitator are missing. On 2026-09-26 OKX.AI delisted #6271 and
          # #8913 and its facilitator refuses us, so free mode is now the intended state: the
          # listing that paid mode existed for is gone. The ASP stays up because the site,
          # the docs and the llms files link to its X Layer ledger at /proof, and the 402
          # guard moved to the rails that sell today (the `rails` job below).
          #
          # So a 200 passes only when the ASP itself says it is free. GET /health publishes
          # payment.mode, the value applyOkxX402 returned when it decided whether to install
          # the paywall: a declaration, not a guess. A 402 still passes, so restoring the OKX
          # keys and paid mode needs no edit here.
          ASP="https://a-identity-asp.onrender.com"
          for i in 1 2 3 4 5 6; do
            # `|| code=000` rather than `|| echo 000`: curl already prints 000 on a failed
            # connection, and echoing another one made the code read 000000.
            code=$(curl -s -D /tmp/asp.hdr -o /tmp/asp.json -w "%{http_code}" --max-time 45 \
              -X POST -H 'Content-Type: application/json' \
              -d '{"agentId":"aid/1"}' "$ASP/tools/verify_agent") || code=000
            echo "attempt $i: HTTP $code"
            # Same trap as the step above: a suspended service also answers 503. Name it
            # rather than retrying six times first.
            if grep -qi '^x-render-routing:[[:space:]]*suspend' /tmp/asp.hdr 2>/dev/null; then
              echo "::error::The ASP service is SUSPENDED on Render, and /proof is down with it."
              exit 1
            fi
            case "$code" in
              402)
                echo "x402 challenge served: the ASP is in paid mode"
                exit 0 ;;
              200)
                # A paid tool answered without payment. Fine only while the ASP says so.
                hcode=$(curl -s -o /tmp/asp-health.json -w "%{http_code}" --max-time 45 "$ASP/health") || hcode=000
                if [ "$hcode" != "200" ]; then echo "GET /health: HTTP $hcode"; sleep 20; continue; fi
                node -e "
                  const read = (f) => { try { return JSON.parse(require('fs').readFileSync(f, 'utf8')) } catch { return null } };
                  const tool = read('/tmp/asp.json');
                  const health = read('/tmp/asp-health.json');
                  if (!tool || tool.tool !== 'verify_agent') {
                    console.log('::error::The ASP answered 200, but not with a verify_agent result.');
                    process.exit(1);
                  }
                  const mode = health && health.payment ? health.payment.mode : undefined;
                  if (mode === undefined) {
                    console.log('::error::GET /health no longer declares payment.mode, so a free answer cannot be told from a fail-open.');
                    process.exit(1);
                  }
                  if (mode !== 'free') {
                    console.log('::error::A paid tool answered without payment while /health declares payment.mode=' + mode + '. That is the fail-open this step exists for.');
                    process.exit(1);
                  }
                  console.log('::notice::The ASP is in free mode, as intended since OKX.AI delisted #6271 and #8913 on 2026-09-26. Its own reason: ' + health.paymentReason);
                "
                exit 0 ;;
              000|5??)
                # No answer or a 5xx: a cold start, a restart or a deploy. Retry.
                sleep 20 ;;
              *)
                echo "::error::The ASP answered HTTP $code, which is neither a 402 challenge nor a tool result."
                cat /tmp/asp.json || true
                exit 1 ;;
            esac
          done
          echo "::error::The ASP gave no usable answer in 6 attempts (last HTTP $code)."
          exit 1

      - name: Traction endpoint answers and excludes CI from its headlines
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          curl -sf --max-time 45 "https://a-identity-backend.onrender.com/api/traction" -o /tmp/traction.json
          node -e "
            const t = require('/tmp/traction.json');
            for (const k of ['activeAgents','checks','protectedNotionalUsd','ci','disclosure']) {
              if (!(k in t)) { console.error('missing field: ' + k); process.exit(1) }
            }
            if (typeof t.ci.checks !== 'number') { console.error('ci.checks must be a number'); process.exit(1) }
            console.log('traction ok: ' + t.checks + ' checks, \$' + t.protectedNotionalUsd + ' protected, ci kept separate (' + t.ci.checks + ')');
          "

  rails:
    # The fail-open guard the ASP step used to be, moved to the rails that sell today. Every
    # rail here is fail-closed by design (501 when unconfigured, never a free serve); this is
    # what notices if that ever stops being true, or if a rail stops offering a challenge.
    # One matrix leg per rail rather than a copied step each: the probe cannot drift between
    # copies, a red rail is named in the run summary, and with fail-fast off one red rail
    # cannot hide another.
    name: Selling rail still charges (${{ matrix.rail }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each call is the one the rail itself documents: POST with a JSON body, to
        # verify_agent, the cheapest tool every rail sells. The comment names the source.
        include:
          # The rail's own 402: tool.method and tool.example.
          - rail: EIP-3009
            path: /api/x402/tools/verify_agent
            body: '{"agentId":"#0"}'
          # /api/x402/gateway/openapi.json, the POST request example.
          - rail: Circle Gateway
            path: /api/x402/gateway/tools/verify_agent
            body: '{"agentId":"#73232"}'
          # The Bazaar listing inside the rail's own 402: POST, JSON body.
          - rail: Algorand
            path: /api/x402/algorand/tools/verify_agent
            body: '{"agentId":"#0"}'
          # docs/chains/stellar.mdx, "Pay for a trust check".
          - rail: Stellar
            path: /api/x402/stellar/tools/verify_agent
            body: '{"agentId":"#849980"}'
          # The rail's own 402: tool.method and tool.example. docs/chains/celo.mdx says we
          # sell the trust tools on Celo, and /api/celo/status reports the rail configured.
          - rail: Celo
            path: /api/celo/tools/verify_agent
            body: '{"agentId":"#1"}'
    steps:
      - name: An unpaid call to a paid tool gets a 402 challenge, not a free answer
        env:
          RAIL: ${{ matrix.rail }}
          TOOL_URL: https://a-identity-backend.onrender.com${{ matrix.path }}
          BODY: ${{ matrix.body }}
        run: |
          set -euo pipefail
          # The retry shape of the live steps: what a cold start, a restart or a deploy can
          # cause is retried, a definite answer is not.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -D /tmp/rail.hdr -o /tmp/rail.json -w "%{http_code}" --max-time 45 \
              -X POST -H 'Content-Type: application/json' -d "$BODY" "$TOOL_URL") || code=000
            echo "attempt $i: HTTP $code from POST $TOOL_URL"
            if grep -qi '^x-render-routing:[[:space:]]*suspend' /tmp/rail.hdr 2>/dev/null; then
              echo "::error::The backend service is SUSPENDED on Render, so no rail can sell."
              exit 1
            fi
            case "$code" in
              402)
                # The status alone is not a challenge: a buyer needs something to pay.
                node -e "
                  let c = null;
                  try { c = JSON.parse(require('fs').readFileSync('/tmp/rail.json', 'utf8')) } catch {}
                  const accepts = c && Array.isArray(c.accepts) ? c.accepts : [];
                  if (!accepts.length) {
                    console.log('::error::The ' + process.env.RAIL + ' rail answered 402 with no accepts list, so there is nothing a buyer could pay.');
                    process.exit(1);
                  }
                  console.log('402 challenge served, payable on ' + accepts.map((a) => a.network).join(', '));
                "
                exit 0 ;;
              200)
                # A paid tool answered without payment. Not a cold start, so not retried away.
                echo "::error::FAIL-OPEN: the $RAIL rail served a paid tool without payment."
                cat /tmp/rail.json || true
                exit 1 ;;
              501)
                # What every rail answers when its configuration is missing.
                echo "::error::The $RAIL rail says it is not configured, so it is not selling."
                cat /tmp/rail.json || true
                exit 1 ;;
              000|429|5??)
                # No answer, a 5xx, or the per-IP rate budget, which resets within a minute.
                sleep 20 ;;
              *)
                echo "::error::The $RAIL rail answered HTTP $code where a 402 challenge was expected."
                cat /tmp/rail.json || true
                exit 1 ;;
            esac
          done
          echo "::error::The $RAIL rail gave no 402 challenge in 6 attempts (last HTTP $code)."
          cat /tmp/rail.json 2>/dev/null || true
          exit 1
