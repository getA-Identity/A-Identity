# Guardrail canary (Phase 5.4).
#
# Answers one question on a schedule: is the guardrail still enforcing? It does that two
# ways, and NEITHER of them touches real money or creates anything:
#
#   1. Reruns the deterministic decision vectors locally. Pure functions, no account, no
#      network, no fabricated market data.
#   2. Probes the live public surfaces, including /api/guardrail-status, which runs canonical
#      vectors through the same pure engine the product uses and returns 503 if any of them
#      answers wrongly.
#
# Explicitly NOT done here, because a monitor that writes is a monitor that can fake
# traction: no agent is created, no decision is recorded, no order or payment is placed on
# any real-money surface. Any synthetic activity that ever does get recorded is flagged `ci`
# and excluded from every traction headline (see policy/meter.ts aggregateTraction).
name: Guardrail canary

on:
  schedule:
    # Hourly. Slower than the keep-warm ping on purpose: this is a correctness check, not a
    # liveness one, and GitHub delays scheduled runs under load anyway.
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  vectors:
    name: Deterministic decision vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install backend deps
        run: npm install --prefix mcp

      - name: Policy engine vectors (pure, offline)
        run: npm test --prefix mcp

  live:
    name: Live public surfaces
    runs-on: ubuntu-latest
    steps:
      - name: Engine self-check on the live backend
        run: |
          set -euo pipefail
          URL="https://a-identity-backend.onrender.com/api/guardrail-status"
          # Retries cover a restart or a deploy in progress. A service that is briefly
          # unreachable is not the same as a guardrail that stopped enforcing.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -D /tmp/status.hdr -o /tmp/status.json -w "%{http_code}" --max-time 45 "$URL" || echo 000)
            echo "attempt $i: HTTP $code"
            # Render answers 503 for a SUSPENDED service, and our own endpoint answers 503
            # for "not enforcing". Same status code, completely different problem, and
            # conflating them means an infrastructure outage gets reported as a broken
            # guardrail. Render marks its own with a routing header, so check that first.
            # Learned the hard way on 2026-07-29, when both services were suspended for
            # exceeding the free monthly instance hours and this step would have blamed
            # the policy engine.
            if grep -qi '^x-render-routing:[[:space:]]*suspend' /tmp/status.hdr 2>/dev/null; then
              echo "::error::The backend service is SUSPENDED on Render. This is infrastructure,"
              echo "::error::not the guardrail. Check Render billing and instance-hour usage."
              exit 1
            fi
            if [ "$code" = "200" ]; then
              node -e "
                const s = require('/tmp/status.json');
                if (!s.enforcing) { console.error('NOT ENFORCING'); process.exit(1) }
                const failed = (s.vectors || []).filter(v => !v.pass);
                if (failed.length) { console.error('failed vectors:', JSON.stringify(failed)); process.exit(1) }
                console.log('enforcing, ' + s.vectors.length + ' vectors passed at ' + s.checkedAt);
              "
              exit 0
            fi
            # A 503 that is NOT a Render suspension came from our own endpoint, which
            # answers 503 exactly when the engine is not enforcing. A real failure, and it
            # must not be retried away.
            if [ "$code" = "503" ]; then
              echo "::error::The guardrail reported NOT enforcing."
              cat /tmp/status.json || true
              exit 1
            fi
            sleep 20
          done
          echo "could not reach the self-check after 6 attempts"
          exit 1

      - name: The paid ASP is still charging, not silently serving for free
        run: |
          set -euo pipefail
          # asp/payment.ts enables x402 only when PAY_TO_ADDRESS + the three OKX keys are
          # all present, and otherwise falls back to `mode: 'free'` and SERVES. That is
          # convenient in development and fail-open in production: if the env were ever
          # cleared on a redeploy, every paid tool would start answering for free and
          # nothing would say so. So the 402 challenge itself is monitored.
          ASP="https://a-identity-asp.onrender.com"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -D /tmp/paid.hdr -o /tmp/paid.json -w "%{http_code}" --max-time 45 \
              -X POST -H 'Content-Type: application/json' \
              -d '{"agentId":"aid/1"}' "$ASP/tools/verify_agent" || echo 000)
            echo "attempt $i: HTTP $code"
            # Same trap as the step above: a suspended service also answers 503, and an
            # unreachable ASP during an OKX review window is urgent for a different reason
            # than a disabled paywall. Name it rather than retrying six times first.
            if grep -qi '^x-render-routing:[[:space:]]*suspend' /tmp/paid.hdr 2>/dev/null; then
              echo "::error::The ASP service is SUSPENDED on Render, so every paid tool is"
              echo "::error::unreachable. OKX reviewers hitting it see 503 instead of a 402."
              exit 1
            fi
            # 402 is the correct answer: the paywall is live and issued a challenge.
            if [ "$code" = "402" ]; then echo "x402 challenge served, paid mode is on"; exit 0; fi
            # 200 means a PAID tool answered without payment. Not a cold start, a real
            # regression, so it must not be retried away.
            if [ "$code" = "200" ]; then
              echo "a paid tool answered without payment: x402 is disabled or misconfigured"
              cat /tmp/paid.json || true
              exit 1
            fi
            sleep 20
          done
          echo "could not reach the ASP after 6 attempts"
          exit 1

      - name: Traction endpoint answers and excludes CI from its headlines
        run: |
          set -euo pipefail
          curl -sf --max-time 45 "https://a-identity-backend.onrender.com/api/traction" -o /tmp/traction.json
          node -e "
            const t = require('/tmp/traction.json');
            for (const k of ['activeAgents','checks','protectedNotionalUsd','ci','disclosure']) {
              if (!(k in t)) { console.error('missing field: ' + k); process.exit(1) }
            }
            if (typeof t.ci.checks !== 'number') { console.error('ci.checks must be a number'); process.exit(1) }
            console.log('traction ok: ' + t.checks + ' checks, \$' + t.protectedNotionalUsd + ' protected, ci kept separate (' + t.ci.checks + ')');
          "
