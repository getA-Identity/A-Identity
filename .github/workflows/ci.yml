name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, or the secret scan below only sees the tip commit and a seed
          # committed last month stays invisible.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Secret scanning we control. GitHub's own is enabled on both remotes and catches
      # PROVIDER patterns; Stellar's seed format is not one of them, and the setting that
      # would catch it, "non-provider patterns", is a paid Secret Protection feature: the
      # API exposes the field, silently refuses to flip it, and the UI does not render it.
      # So on the free tier a committed Stellar seed is invisible to GitHub. This is not.
      #
      # fetch-depth 0 above is what lets it scan history rather than just the tip.
      # The BINARY, not gitleaks/gitleaks-action@v2. The action refuses to run for an
      # organization without a paid licence key ("missing gitleaks license"), and
      # getA-Identity is one, so every push since this step was added failed here before a
      # single test ran. The scanner itself is MIT and free; only the wrapper is licensed.
      # Pinned by version rather than floating, because a scanner that silently changes
      # what it detects is worse than one that does not run.
      - name: Secret scan (Stellar seeds included)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner .

      - name: Install frontend deps
        run: npm install

      - name: Install backend deps
        run: npm install --prefix mcp

      - name: Lint frontend
        run: npm run lint

      - name: Build backend + unit tests
        run: npm test --prefix mcp

      - name: Full E2E flow (start backend, drive the whole product, tear down)
        run: |
          node mcp/dist/http.js &
          BACKEND=$!
          for i in $(seq 1 30); do curl -sf http://localhost:3399/health >/dev/null && break; sleep 1; done
          # Payments and identity end to end.
          npm run e2e --prefix mcp
          # The guardrail product end to end: policy storage, both live surfaces, the
          # planned one staying inert, the audit trail, the badge, ownership, and traction
          # accounting. Unit tests prove each piece; this proves they are wired together.
          npm run e2e:guardrail --prefix mcp
          # MCP transport + REST companions against the same running server.
          npm run http-smoke --prefix mcp
          kill $BACKEND 2>/dev/null || true

      # Same pipeline Vercel runs at deploy: repo checks (SEO/structured data,
      # agent-skills index, oauth mirror, sitemap, prerender staleness), then
      # tsc --noEmit, vite build, and apply-prerender. Running the raw vite
      # build here used to let drift pass CI green and fail only at deploy.
      - name: Build frontend (check + typecheck + vite build + prerender)
        run: npm run build
