[package]
name = "agent-spend-policy"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "An on-chain spend policy for an AI agent's USDC wallet on Stellar. The ledger enforces the limit, not a server."

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
# Opt-in ONLY, and deliberately absent from any `default` list. `cargo fuzz` builds the
# contract as a library and needs the SDK's test harness to construct an `Env`, so without
# a named feature there is no way to reach it from a fuzz target. Keeping it out of
# `default` is the first line of defence, but it is NOT the reason this is safe, and the
# original wording here was wrong. It said `stellar contract build` does not pass
# `--features`. It does accept them, `--all-features` included. What actually protects the
# release artifact is that soroban-sdk's testutils CANNOT COMPILE for `wasm32v1-none`:
# asking for it fails the build with about 180 errors rather than quietly producing a wasm
# with test hooks in it. Fail-closed by construction instead of by convention. Corrected
# 2026-08-24 by an audit agent, which also confirmed the built wasm hash is unchanged by
# this edit (155eb31c...).
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
