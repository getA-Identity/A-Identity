            "name": "A-Identity",
            "inLanguage": "en",

          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://a-identity.xyz/#software",
            "name": "A-Identity",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "url": "https://a-identity.xyz/",
            "description": "Verified on-chain agent identity (ERC-8004) and a policy-guarded USDC wallet on Circle Arc: autonomous, bounded, human-on-the-loop agent payments via x402, Circle Nanopayments, Gateway, and CCTP.",
            "publisher": { "@id": "https://a-identity.xyz/#organization" },
            "featureList": [
              "ERC-8004 on-chain agent identity",
              "KYA wallet-control attestation",
              "Deterministic 0 to 1000 reputation score",
              "Pre-transaction ALLOW / WARN / DENY risk verdicts",
              "Spend limits enforced on-chain",
              "x402 pay-per-call in USDC",
              "Gasless Circle Gateway nanopayments on Arc",
              "ERC-8183 job escrow",
              "MCP server with 19 tools"
            ],
            "offers": {
              "@type": "AggregateOffer",
              "priceCurrency": "USD",
              "lowPrice": "0",
              "highPrice": "0.01",
              "offerCount": "7",
              "description": "Pay per call in USDC over x402. No subscription, no API key, no account.",
              "offers": [
                {
                  "@type": "Offer",
                  "name": "trust_preview",
                  "description": "Coarse trust band plus revoked and Sybil flags. Rate limited.",

          },
          {
            "@type": "FAQPage",
            "@id": "https://a-identity.xyz/#faq",
            "url": "https://a-identity.xyz/",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Does A-Identity touch my money or hold my keys?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. We never hold a key, never move a dollar, and never place the order. Your agent asks whether an action is inside the limits you set, we answer allow, ask a human or no, and the account stays exactly where it was. That is not a promise we are asking you to trust, it is the shape of the product: there is no endpoint that accepts your brokerage credentials, because we never want to be the reason someone loses them."
                }
              },
              {
                "@type": "Question",
                "name": "Can the agent talk its way past the limits?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The limits are not a prompt, so there is nothing to argue with. They are checked outside the model, and on every path that moves money rather than only on orders: a recurring buy, an account setting, money wired out, a cancelled protective position. That last part is where naive guardrails leak, because an agent blocked from buying can simply schedule the buy instead. A refusal cannot be overwritten, and attempts to overwrite one are counted rather than quietly rejected. Trading on borrowed money is not a setting we offer at all."
                }
              },
              {
                "@type": "Question",
                "name": "What happens if you go down while my agent is running?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Nothing of ours can break a trade, because we are not in the execution path. When our own package cannot get a verdict it refuses to act rather than guessing, which is the safe direction to fail in. And you do not have to take our word for whether the engine is up: this endpoint (https://a-identity-backend.onrender.com/api/guardrail-status) runs the real engine on request and answers 503 if it is not enforcing. A monitor checks it every hour."
                }
              },
              {
                "@type": "Question",
                "name": "Do you see my portfolio?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Only for the length of one question. The account state arrives with each check and is never stored. The decision log keeps a hash of it instead, which proves which state a verdict was computed against without keeping the contents, so a refusal stays auditable and your positions stay yours. The public numbers are aggregate only: nothing in them identifies an agent, an owner, a holding or a single amount."
                }
              },
              {
                "@type": "Question",
                "name": "Is this live, or a demo?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Live, and here is the part most products would hide: the public counters currently read zero. The engine is real and enforcing, but no live agent has produced a decision yet, so there is nothing honest to count. We would rather show a zero you can verify than a number you cannot reproduce. When that changes it changes on the same public endpoint (https://a-identity-backend.onrender.com/api/traction), measured rather than projected."
                }
              },
              {
                "@type": "Question",
                "name": "What does it actually cover today?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Brokerage trading and card spending, both live. The engine does not know which venue is asking, so a new one is an adapter rather than a rewrite. Two honest limits: on a card we can refuse a charge before it happens but we cannot physically stop an agent that already holds the card number, and prediction markets are designed and deliberately not built, a separately regulated venue with no agent surface yet, and we will not write rules against a payload nobody has published."
                }
              }
            ]
          }

    <!--
      Fonts are self-hosted from /public/fonts and declared in src/index.css.
      These two faces paint above the fold (the hero heading and body copy), so
      they are preloaded here to start downloading alongside the HTML instead of
      waiting for the bundled stylesheet to parse. `crossorigin` is required
      even for same-origin fonts, which are always fetched in CORS mode; without
      it the browser downloads the file twice. The latin-ext subset is
      deliberately not preloaded, since unicode-range keeps it conditional.
    -->
    <!-- The console still is the largest element on the landing page, so it is the
      LCP element. Without this the browser cannot discover it until the CSS has
      parsed and layout has run, which puts a round trip between first paint and
      the thing being measured. Only the light still is preloaded: it is the
      default theme, and preloading both would spend the budget twice to use half
      of it. -->
    <link rel="preload" as="image" href="/console-hero-light.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/helvetica-now-display-bold.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
