<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real values on a
         notched phone; without it they are all 0 and the insets applied in the mobile
         drawers do nothing. It lets content extend under the notch, which is why those
         drawers pad themselves back out. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Primary meta -->
    <title>A-Identity · The Passport & Wallet for the Agentic Economy</title>

      name="description"
      content="A-Identity gives every AI agent a verified on-chain identity (ERC-8004) and a policy-guarded USDC wallet on Circle Arc. Agents pay autonomously within human-set limits: x402, Circle Nanopayments, Gateway, and CCTP. Verified first, bounded always."
    />
    <meta
      name="keywords"
      content="agentic economy, AI agent identity, ERC-8004, x402, Circle Arc, USDC, Circle Nanopayments, CCTP, agent wallet, Know Your Agent, bounded authority, stablecoin payments, MCP"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#7342e2" />
    <meta name="author" content="A-Identity" />

    <meta property="og:image" content="https://a-identity.xyz/og-image.png" />

    <!-- Base app ownership. Base reads this tag off the homepage to confirm we control
         the domain, so it has to survive prerendering: the snapshot is generated from
         this file's head, which is why it lives here and not in a per-route hook. -->
    <meta name="base:app_id" content="6a7ad82c89d920176739d2d4" />

    <!-- Agent-native discovery -->
    <link rel="agent-manifest" href="/.well-known/ai-agent-manifest.json" />

            ],

            }
          },
          {
            "@type": "WebSite",
            "@id": "https://a-identity.xyz/#website",
            "url": "https://a-identity.xyz/",

            "inLanguage": "en",
            "publisher": { "@id": "https://a-identity.xyz/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://a-identity.xyz/#software",
            "name": "A-Identity",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "url": "https://a-identity.xyz/",
            "description": "Verified on-chain agent identity (ERC-8004) and a policy-guarded USDC wallet on Circle Arc: autonomous, bounded, human-on-the-loop agent payments via x402, Circle Nanopayments, Gateway, and CCTP.",
            "publisher": { "@id": "https://a-identity.xyz/#organization" },
            "featureList": [

              "Deterministic 0 to 1000 reputation score",

            "offers": {
              "@type": "AggregateOffer",
              "priceCurrency": "USD",
              "lowPrice": "0",
              "highPrice": "0.01",
              "offerCount": "7",
              "description": "Pay per call in USDC over x402. No subscription, no API key, no account.",
              "offers": [
                {

                {

                "@type": "Question",
                "name": "Do you hold my keys, move my money, or see my portfolio?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No to all three. There is no endpoint that accepts your brokerage credentials: we never hold a key, never move a dollar, and never place the order. Your agent asks whether an action is inside the limits you set, we answer allow, ask a human or no, and the account stays exactly where it was. Account state arrives with the question and is never stored. The decision log keeps a hash of it instead, so a refusal stays auditable and your positions stay yours."
                }
              },
              {
                "@type": "Question",
                "name": "Can the agent talk its way past the limits?",
                "acceptedAnswer": {
                  "@type": "Answer",

                }
              },
              {
                "@type": "Question",
                "name": "Is this live, and what does it cover today?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Live, on brokerage trading and card spending. Here is the part most products would hide: the public counters read zero, because the engine is enforcing but no live agent has produced a decision yet, and we would rather show a zero you can verify on the public endpoint (https://a-identity-backend.onrender.com/api/traction) than a number you cannot reproduce. Two honest limits: on a card we can refuse a charge before it happens but we cannot stop an agent that already holds the card number, and prediction markets are designed and deliberately not built."
                }
              }
            ]

    </script>

    <!--
      Fonts are self-hosted from /public/fonts and declared in src/index.css.
      These two faces paint above the fold (the hero heading and body copy), so
      they are preloaded here to start downloading alongside the HTML instead of
      waiting for the bundled stylesheet to parse. `crossorigin` is required
      even for same-origin fonts, which are always fetched in CORS mode; without
      it the browser downloads the file twice. The latin-ext subset is
      deliberately not preloaded, since unicode-range keeps it conditional.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/helvetica-now-display-bold.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
