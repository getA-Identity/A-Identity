<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 512 512">
  <!--
    Tab icon: the mark in cream, always.

    This used to follow prefers-color-scheme and flip to ink on light browser chrome. It is
    held at cream by choice, because the white mark is the one the brand is recognised by and
    consistency wins here over adaptation. The cost is real and worth naming: against a light
    tab strip it has very little contrast.

    The geometry (the A-I ribbon monogram, 2026-08 rebrand) is duplicated from
    src/components/Logo.tsx because a static file cannot import from TypeScript. If the mark
    ever changes, change it in both places.
  -->
  <defs>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M 108 290 C 240 276 340 282 466 306 L 440 362 C 330 340 240 336 108 352 Z" fill="#000" stroke="#000" stroke-width="16"/>
      <path d="M 440 362 L 466 352 L 458 430 Q 446 441 436 428 Z" fill="#000" stroke="#000" stroke-width="16"/>
    </mask>
  </defs>
  <g mask="url(#gap)">
    <path d="M 40 472 L 168 48 Q 200 20 232 48 L 344 472 L 282 472 L 200 190 L 102 472 Z" fill="#f2f2ee"/>
    <path d="M 368 472 L 381 70 Q 383 56 397 56 L 429 56 Q 443 56 442 70 L 430 472 Z" fill="#f2f2ee"/>
  </g>
  <path d="M 108 290 C 240 276 340 282 466 306 L 440 362 C 330 340 240 336 108 352 Z" fill="#f2f2ee"/>
  <path d="M 440 362 L 466 352 L 458 430 Q 446 441 436 428 Z" fill="#f2f2ee"/>
</svg>
