<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 256 256">
  <!--
    Tab icon: the mark in cream, always.

    This used to follow prefers-color-scheme and flip to ink on light browser chrome. It is
    held at cream by choice, because the white mark is the one the brand is recognised by and
    consistency wins here over adaptation. The cost is real and worth naming: against a light
    tab strip it has very little contrast.

    The path geometry is duplicated from src/components/Logo.tsx (MARK_PATH) because a static
    file cannot import from TypeScript. If the mark ever changes, change it in both places.
  -->
  <path fill="#f2f2ee" d="M 64 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 L 128 64 L 128 64.5 L 161 32 L 192 0 L 256 0 L 256 64 L 192 128 L 128 128 L 128 192 L 96 223 L 63.5 256 L 0 256 L 0 192 Z M 256 192 L 224 223 L 191.5 256 L 128 256 L 128 192 L 192 128 L 256 128 Z"/>
</svg>
