<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Social card, vector source. The served og-image.png is rendered from the same
    composition (Playwright over an HTML twin, real site fonts); this SVG is the
    editable record of the layout so the two cannot drift silently in shape.
    Mark: the A-I ribbon monogram (2026-08 rebrand), geometry duplicated from
    src/components/Logo.tsx because a static file cannot import TypeScript.
  -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E2B8F"/><stop offset="0.55" stop-color="#5B34B8"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CF0"/><stop offset="1" stop-color="#B7A6F8"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F2FA8"/><stop offset="0.55" stop-color="#7342E2"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M 108 290 C 240 276 340 282 466 306 L 440 362 C 330 340 240 336 108 352 Z" fill="#000" stroke="#000" stroke-width="16"/>
      <path d="M 440 362 L 466 352 L 458 430 Q 446 441 436 428 Z" fill="#000" stroke="#000" stroke-width="16"/>
    </mask>
  </defs>
  <rect width="1200" height="630" fill="#f2f2ee"/>
  <g transform="translate(322 170) scale(0.371)">
    <g mask="url(#gap)">
      <path d="M 40 472 L 168 48 Q 200 20 232 48 L 344 472 L 282 472 L 200 190 L 102 472 Z" fill="url(#grad)"/>
      <path d="M 368 472 L 381 70 Q 383 56 397 56 L 429 56 Q 443 56 442 70 L 430 472 Z" fill="url(#grad)"/>
    </g>
    <path d="M 108 290 C 240 276 340 282 466 306 L 440 362 C 330 340 240 336 108 352 Z" fill="url(#rib)"/>
    <path d="M 440 362 L 466 352 L 458 430 Q 446 441 436 428 Z" fill="url(#rib)"/>
  </g>
  <text x="548" y="308" font-family="Helvetica Now Display, Helvetica, Arial, sans-serif" font-weight="bold" font-size="118" letter-spacing="-3" fill="#192837">A-Identity</text>
  <text x="600" y="420" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="500" font-size="30" fill="rgba(25,40,55,0.62)">Trust, before you pay. The passport and wallet for the agentic economy.</text>
  <rect x="0" y="616" width="1200" height="14" fill="url(#rail)"/>
</svg>
