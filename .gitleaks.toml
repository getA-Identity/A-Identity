# Secret scanning we control, because the half GitHub gives us free does not cover Stellar.
#
# GitHub's secret scanning is enabled on both remotes and catches PROVIDER patterns: AWS
# keys, Stripe tokens, GitHub tokens. Stellar's secret seed format is not on that list. The
# setting that would catch it, "non-provider patterns", is a paid Secret Protection feature:
# the API exposes the field, refuses to flip it, and the UI does not render it at all. So on
# the free tier a Stellar seed committed by accident is invisible to GitHub.
#
# This file closes that gap in CI instead. Verified against a real generated seed.

[extend]
useDefault = true

[[rules]]
id = "stellar-secret-seed"
description = "Stellar ed25519 secret seed (S + 55 base32 characters)"
# StrKey is RFC 4648 base32: A-Z and 2-7 only, so no 0, 1, 8 or 9. The version byte makes
# a secret seed start with S, and the whole thing is exactly 56 characters. Anchored on
# both sides so a longer base32 blob does not match a substring of itself.
regex = '''\bS[A-Z2-7]{55}\b'''
keywords = ["S"]
entropy = 3.5

[[rules]]
id = "near-ed25519-secret-key"
description = "NEAR ed25519 secret key (ed25519: + base58 of 64 bytes)"
# NEAR serializes an ed25519 secret key as the 32-byte seed followed by the 32-byte public
# key, base58-encoded, which is 86 to 88 characters after the prefix. A public key or a
# transaction hash is 32 bytes, 43 or 44 characters, so the length alone keeps them out:
# this repository quotes NEAR public keys and tx hashes on purpose and must not trip on
# them. An ed25519 SIGNATURE is also 64 bytes and would match, which is acceptable,
# because none belongs in the tree either. Verified against a generated key, a real
# testnet public key and a real testnet tx hash on 2026-11-12.
regex = '''ed25519:[1-9A-HJ-NP-Za-km-z]{85,90}\b'''
keywords = ["ed25519:"]

# There is deliberately NO rule for EVM private keys, and the reason is worth writing down
# so nobody adds one back. An EVM private key is 0x plus 64 hex characters. So is a
# transaction hash. So is a block hash. They are indistinguishable by shape, and this
# repository is full of transaction hashes: every provenance artifact, every release
# receipt, every proof link. A rule for that shape found 7,749 "leaks" on the first run.
# A scanner that cries wolf 7,749 times is worse than no scanner, because the one real hit
# is then invisible. EVM keys have to be caught by review and by never putting one in a
# config file, which is the discipline this repo already follows: the only ones present are
# Hardhat's published defaults, in tests, as assertions.

# One [[allowlists]] block per kind of exception (gitleaks 8.21+ refuses the older single
# [allowlist] beside it). In this first block a finding is skipped when its PATH or its
# SECRET matches, the same OR the single block had.
[[allowlists]]
description = "Known-safe values, each justified rather than blanket-ignored"
paths = [
  # Test fixtures only. Verified during the 2026-08-25 audit: these four derive to Hardhat's
  # published default accounts #1 and #5, whose private keys appear in Hardhat's own manual.
  # They are used as `expected` assertions, never as configuration, and appear nowhere
  # outside a *.test.ts file. Balance is deliberately NOT the test here: a key published in
  # a manual is unsafe whatever its balance.
  '''mcp/src/x402\.test\.ts''',
  '''mcp/src/x402-3009/engine\.test\.ts''',
  '''mcp/src/x402-3009/facilitator\.test\.ts''',
  '''mcp/src/chains/evm/adapter\.test\.ts''',
  '''mcp/src/celo-x402\.test\.ts''',
  # Same two Hardhat defaults (#1 and #5), added 2026-08-30 and 2026-09-02 as the signing
  # fixtures for the PAYMENT-RESPONSE receipt test and the claim re-read tests. Verified
  # against Hardhat's manual before allowlisting; still assertions, never configuration.
  '''mcp/src/x402-3009/rail\.test\.ts''',
  '''mcp/src/platform/claim\.test\.ts''',
  # ARC-56 application specs describe the contract's storage schema, and every storage slot
  # carries a `"key"` field holding the base64 of its NAME ("ZGFpbHlfY2Fw" is "daily_cap").
  # The generic-api-key rule reads the word "key" plus a base64 blob as a credential. It is
  # a schema, generated by the compiler, with nothing secret in it.
  '''algorand/contracts/.*\.arc56\.json''',
  # The audit's own evidence files quote scanner output and finding text verbatim.
  '''audit/''',
]
regexes = [
  # Public Stellar addresses and contract ids are not secrets. G is an account, C is a
  # contract; only S is a seed, and it is deliberately NOT listed here.
  '''\bG[A-Z2-7]{55}\b''',
  '''\bC[A-Z2-7]{55}\b''',
  # Circle's CCTP V2 contract addresses, one pair per environment, published at
  # developers.circle.com/cctp/references/contract-addresses and recorded in the chain
  # registry as `tokenMessenger:`. The generic-api-key rule reads "token" next to a hex
  # blob as a credential; these are 20-byte contract addresses anyone can call. Added
  # 2026-09-10 when the registry gained them. Each is the exact published value, so a
  # typo in the registry would NOT be allowlisted, which is the point of listing values
  # rather than the field name.
  '''0x28b5a0e9C621a5BadaA536219b3a228C8168cf5d''',
  '''0x8FE6B999Dc680CcFDD5Bf7EB0974218be2542DAA''',
  # OpenZeppelin's WebAuthn verifier wasm, sha256 as smart-account-kit publishes it and as
  # soroban/third-party/openzeppelin-smart-account/build.sh rebuilds it, and the hash the
  # same source gives under a different toolchain (the receipt's control build). A code
  # hash anyone can fetch off the ledger, flagged because it sits next to a field name
  # containing "verifier". Added 2026-10-03, exact values only.
  '''e63a030d0f1a1481e36059a4837c433083b33e704c1f9625b7314795b6d72b76''',
  '''71df7b7aa9f7b14b9245f60977a26ea918a5ab38423e12fc0e0cd7fdea8e7995''',
  # Passkey authenticator AAGUIDs in src/lib/stellar/passkey-device.ts, from the public
  # passkey-authenticator-aaguids list. They identify a password manager's MODEL, not a
  # credential, and are flagged only because the line above each names a "Password" product.
  # Added 2026-10-03, exact values only.
  '''dd4ec289-e01d-41c9-bb89-70fa845d4bf2''',
  '''adce0002-35bc-c60a-648b-0b25f1f05503''',
  '''d548826e-79b4-db40-a3d8-11116f7e8349''',
  # The NAME of the environment variable that holds the buyer key, as mcp/scripts/
  # arc-vtp-runner.mjs declares it (OPERATOR_KEY_ENV = '...'), never its value. The
  # generic-api-key rule reads "KEY" beside a high-entropy word as a credential. Added
  # 2026-11-02, the exact name only.
  '''^X402_3009_BUYER_KEY$''',
  # Circle's native USDC contract on NEAR mainnet, a 64-hex implicit account id published at
  # developers.circle.com and read from ft_metadata on chain. The generic-api-key rule reads
  # "token_id" beside 64 hex characters as a credential; it is the public contract the mainnet
  # vault's get_config returns, quoted in near/judge/claims.json. Added 2026-11-12, exact value only.
  '''17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1''',
]

# The Stellar transaction archive. Each file's decoded section carries `authDigestHex`: the
# sha256 of the Soroban authorization payload, which stellar-archive-tx.mjs recomputes from
# the public envelope to check a passkey signature's challenge binding. It is derived from
# ledger data anyone can read, and every new owner action adds one, so it is allowed by the
# shape of the whole MATCH (the field name plus a 64-hex value) rather than value by value.
# Deliberately not by path: a path-scoped allowlist was tried first and it also hid a
# Stellar seed planted in the archive, so the seed rule must keep seeing that directory.
[[allowlists]]
description = "authDigestHex in the Stellar tx archive is a public, recomputable digest"
regexTarget = "match"
regexes = ['''^authDigestHex": "[0-9a-f]{64}"$''']

# The Circle Gateway proof log and the docs that quote it carry `authNonce`: the EIP-3009
# authorization nonce, a random 32-byte value the BUYER chose and published by signing it.
# It is part of the on-chain authorization and of GET /api/x402/gateway/proof, so anyone can
# read it, and it unlocks nothing: the authorization is single-use and already spent by the
# time the row exists. The generic-api-key rule reads "auth" beside a hex blob as a
# credential. Allowed by the shape of the whole match (the field name plus a hex value, full
# or abbreviated), because every quoted proof row carries one. Added 2026-10-19 when the Arc
# integration guide quoted a real settlement row.
[[allowlists]]
description = "authNonce in quoted Gateway proof rows is the buyer's public EIP-3009 nonce"
regexTarget = "match"
regexes = ['''^"?authNonce": "0x[0-9a-f.]+"$''']

# mcp/src/arc-owner-vault.ts ties each key env var's NAME to the PUBLIC address of that key, so a
# vault owned by one of ours is refused even where the env var is not set. The generic-api-key rule
# reads the word KEY beside a hex value as a credential. Allowed by the shape of the whole match:
# a name ending in _KEY and 20 bytes of hex. A private key is 32 bytes, so it does not fit this shape
# and is still reported. Added 2026-11-04.
[[allowlists]]
description = "OUR_KEY_PUBLIC_ADDRESSES: an env var name and the public address of that key"
regexTarget = "match"
regexes = ['''^[A-Z0-9_]+_KEY: '0x[0-9a-fA-F]{40}'$''']

# NEAR public keys. The NEAR integration (near/, its docs and the proof page) quotes the agent's
# function-call PUBLIC key on purpose, because "which key may call what" is the claim a reader has
# to be able to check on chain. The generic-api-key rule reads "key" beside the base58 value as a
# credential. Allowed by the shape of the whole match: ed25519: plus exactly 43 or 44 base58
# characters (32 bytes) at the end of the match. A NEAR SECRET key is 64 bytes, 86 to 88
# characters, so it cannot fit this shape, and the near-ed25519-secret-key rule above still
# reports it. Added 2026-11-12, verified against a real testnet public key and a generated key.
[[allowlists]]
description = "NEAR ed25519 public keys (32-byte base58) quoted in the NEAR docs and proof"
regexTarget = "match"
regexes = ['''ed25519:[1-9A-HJ-NP-Za-km-z]{43,44}[.,;:'")\]]*$''']
